[project]
name = "assessorai"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi[standard]",
    "uvicorn",
    "fpdf",
    "python-docx",
    "pypdf",
    "markdown",
    "requests",
    "langchain-core",
    "langchain-google-genai",
    "langchain-google-vertexai",
    "python-dotenv",
    "python-multipart",
    "openai>=1.3.0",
    "google-cloud-storage",
    "tiktoken",
    "sendgrid",
    "pgvector",
    "slowapi",
    "python-jose[cryptography]",
    "passlib",
    "bcrypt",
    "SQLAlchemy>=2.0.0",
    "psycopg2-binary",
    "Pillow>=10.0.0",
]

[project.optional-dependencies]
client = [
    "streamlit==1.39.0",
    "streamlit-quill==0.0.3",
    "pandas==2.2.2",
]
test = [
    "pytest",
    "pytest-cov",
]
dev = [
    "ruff",
]

[tool.setuptools]
packages = ["assessorai"]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-dir]
assessorai = "."
